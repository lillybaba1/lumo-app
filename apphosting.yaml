# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 3
  # Minimum instances to keep warm
  minInstances: 1
  # Increase CPU and memory for file upload handling
  cpu: 1
  memoryMiB: 1024
  # Increase timeout for file uploads (max 60 minutes)
  timeoutSeconds: 300

# Environment variables for production
env:
  - variable: FIREBASE_STORAGE_BUCKET
    value: lumo-app-183f5.firebasestorage.app
  - variable: STORAGE_BUCKET
    value: lumo-app-183f5.firebasestorage.app
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME

# This application is a dynamic Next.js app, not a static site.
# serveStatic: false tells App Hosting to run the 'start' script.
serveStatic: false
