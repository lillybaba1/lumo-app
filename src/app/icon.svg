<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Gambian Flag -->
  <rect width="48" height="48" fill="#ffffff"/>
  <!-- Red stripe (top) -->
  <rect y="0" width="48" height="13.7" fill="#CE1126"/>
  <!-- White stripe -->
  <rect y="13.7" width="48" height="3.4" fill="#FFFFFF"/>
  <!-- Blue stripe (center) -->
  <rect y="17.1" width="48" height="13.7" fill="#0C1C8C"/>
  <!-- White stripe -->
  <rect y="30.9" width="48" height="3.4" fill="#FFFFFF"/>
  <!-- Green stripe (bottom) -->
  <rect y="34.3" width="48" height="13.7" fill="#3A7728"/>
</svg>
